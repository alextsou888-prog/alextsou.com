  <text x="30" y="128" class="section">冠捷科技股份有限公司 (TPV)</text><text x="30" y="159" class="body muted">消費性電子產品製造業｜500 人以上</text>
  <rect x="30" y="182" width="348" height="42" rx="21" fill="#dfeafa"/><text x="51" y="210" class="label">FAE 工程師｜管理 4 人以下｜新北市</text>
  <text x="30" y="265" class="section orange">產品範疇　TV / Android TV</text>
